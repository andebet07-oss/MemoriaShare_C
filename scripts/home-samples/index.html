<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home sample magnets</title>
    <style>
      body { margin: 0; padding: 24px; background: #1c1c20; color: #fcfcfe; font: 14px system-ui, sans-serif; }
      #list { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
      figure { margin: 0; width: 180px; }
      figure img { width: 100%; display: block; }
      figcaption { margin-top: 6px; color: #b4b4b4; word-break: break-all; }

  <body>
    <h1>Home sample magnets</h1>

    <p id="status">Rendering…</p>
    <div id="list"></div>
    <script type="module" src="./render.js"></script>
